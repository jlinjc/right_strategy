<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作戰中心 v2 · 實證版</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0a0e17; --panel:#121826; --panel2:#1a2233; --line:#26304a;
    --txt:#e6ecf5; --muted:#8a96ad; --accent:#4da3ff;
    --green:#2ecc71; --red:#ff5a5a; --yellow:#ffcb45; --orange:#ff9d5a; --grey:#6b7686;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;
    line-height:1.55;padding:0 0 60px}
  a{color:var(--accent);text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px}
  header{background:linear-gradient(180deg,#0e1422,#0a0e17);border-bottom:1px solid var(--line);padding:12px 0;position:relative}
  .hrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:17px}
  .brand .sub{font-size:11.5px;color:var(--muted)}
  .vswitch{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
  .vswitch a{padding:6px 12px;font-size:12.5px;color:var(--muted);background:var(--panel)}
  .vswitch a.on{background:var(--accent);color:#04101f;font-weight:700}
  .updated{font-size:12px;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0}
  .card h2{font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mkt{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mkt.one{grid-template-columns:1fr}
  @media(max-width:860px){.mkt{grid-template-columns:1fr}}
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--panel2)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font-size:11px;color:var(--muted);font-weight:600;text-align:left;padding:5px 6px;background:var(--panel2);white-space:nowrap}
  td{padding:7px 6px;border-top:1px solid #1b2436;vertical-align:top}
  .act{font-weight:800;white-space:nowrap;font-size:12.5px}
  .buy{color:var(--green)} .wait{color:var(--yellow)} .cash{color:var(--grey)} .sell{color:var(--red)} .reduce{color:var(--orange)} .grey{color:var(--grey)}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap}
  .why{font-size:12px;color:var(--muted);line-height:1.55}
  input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--txt);
    padding:5px 8px;font-size:13px;width:130px}
  .tabwrap{position:relative}
  .tabwrap::after{content:'';position:absolute;right:0;top:0;bottom:0;width:28px;pointer-events:none;
    background:linear-gradient(90deg,rgba(10,14,23,0),var(--bg))}
  @media(min-width:700px){.tabwrap::after{display:none}}
  .tabbar{display:flex;gap:6px;margin:12px 0 4px;overflow-x:auto;scrollbar-width:none;padding-right:20px}
  .tabbar::-webkit-scrollbar{display:none}
  .tabbtn,.subbtn,.mbtn{padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);border-radius:9px;white-space:nowrap;flex:none}
  .subbtn,.mbtn{padding:5px 11px;font-size:12.5px}
  .tabbtn.on,.subbtn.on,.mbtn.on{color:var(--txt);background:var(--panel2);border-color:var(--accent)}
  .pane{display:none} .pane.on{display:block}
  .sub{display:none} .sub.on{display:block}
  details>summary{cursor:pointer;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:'▸';display:inline-block;margin-right:5px;color:var(--accent);transition:transform .15s}
  details[open]>summary::before{transform:rotate(90deg)}
  .ev{border:1px solid var(--line);border-radius:10px;margin:9px 0;overflow:hidden;background:var(--panel)}
  .ev summary{padding:10px 13px;font-size:13.5px;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ev .body{padding:0 13px 12px;font-size:12.5px;color:var(--muted);line-height:1.7}
  .st{font-size:11px;padding:1px 7px;border-radius:5px;border:1px solid var(--line);color:#9fb0cc}
  .foot{color:var(--muted);font-size:11.5px;margin-top:20px;text-align:center}
  .note{font-size:12px;color:var(--muted);margin-top:8px}
  .rowline{display:flex;gap:8px;align-items:baseline;margin-top:4px;font-size:12.5px}
  .rowline .who{color:var(--muted);flex:none;width:44px}
  .sum{background:#0e1b2e;border:1px solid #2a4a72;border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0 8px}
  .warnbox{margin:6px 0;border-radius:8px;padding:8px 10px;font-size:12.5px}
  .warnbox.red{background:#3a1414;border:1px solid #7a2a2a;color:#ffc9c9}
  .warnbox.orange{background:#2a1d10;border:1px solid #6b4a1e;color:#ffd9b0}
  .warnbox.blue{background:#0e1b2e;border:1px solid #2a4a72;color:#cfe2ff}
  .tlab{font-size:11px;color:#8090a8;white-space:nowrap}
  @media(max-width:600px){
    table.diff tr:first-child{display:none}
    table.diff tr{display:block;border-top:1px solid var(--line);padding:6px 0}
    table.diff td{display:block;border:0;padding:2px 4px}
    table.diff td::before{content:attr(data-l)'：';color:var(--muted);font-size:11px}
  }
</style>
</head>
<body>
<header><div class="wrap hrow">
  <div class="brand">
    <h1>作戰中心 <span style="color:var(--accent)">v2</span></h1>
    <div class="sub">目前使用中的版本 · 每條規則都附得起數據</div>
  </div>
  <div class="vswitch"><a href="strategy_dashboard.html" title="原版 = 單押輪動的呈現方式 + 舊面板(進取模式等);每檔的訊號兩版共用同一份資料">原版</a><a class="on" href="v2.html">新版</a></div>
</div></header>

<div class="wrap">
  <div class="updated" id="updated" style="margin-top:10px">載入中…</div>
  <details style="margin-top:6px"><summary class="why" style="display:inline">ℹ️ 這是什麼網站?怎麼用?</summary>
    <div class="why" style="padding:6px 0 0 14px;font-size:12.5px">
      個人研究用的 ETF 趨勢擇時規則:美股 5 檔、台股 4 檔 ETF,價格在 200 日均線之上才持有,
      再用債券市場的「信用哨」調整部位大小。<b>每天只要看「今天怎麼做」每個市場最上面的一行總結</b>,
      細節再點開看。所有績效數字都是歷史回測,不保證未來;<b>這不是投資建議</b>,請自行判斷並承擔風險。
    </div></details>

  <div class="tabwrap"><div class="tabbar" id="tabbar">
    <button class="tabbtn on" data-t="today">🎯 今天怎麼做</button>
    <button class="tabbtn" data-t="dec">⚙️ 我的設定</button>
    <button class="tabbtn" data-t="res">📚 研究細節</button>
  </div></div>

  <div class="pane on" id="p-today">
    <div class="card" style="border-color:var(--accent)">
      <h2>💰 這套策略的總資金(含已持有的市值)</h2>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center">
        <label style="font-size:13px">🇺🇸 美股 $<input type="number" id="cap_us" placeholder="例 10000" oninput="setCap('us',this.value)"></label>
        <label style="font-size:13px">🇹🇼 台股 NT$<input type="number" id="cap_tw" placeholder="例 300000" oninput="setCap('tw',this.value)"></label>
      </div>
      <div class="note">填了才會算出每一份的目標金額和股數。只存在這個瀏覽器,不會上傳;換手機/電腦或清除瀏覽器資料要重填。</div>
    </div>
    <div style="display:flex;gap:6px;margin:4px 0 0" id="mktsel"></div>
    <div class="mkt" id="markets"></div>
  </div>

  <div class="pane" id="p-dec"><div id="decBox"></div></div>

  <div class="pane" id="p-res">
    <div class="tabbar" id="subbar" style="margin-top:10px">
      <button class="subbtn on" data-s="fwd">📈 前瞻追蹤</button>
      <button class="subbtn" data-s="ev">📐 規則與證據</button>
      <button class="subbtn" data-s="news">🧪 研究紀錄</button>
      <button class="subbtn" data-s="limit">⚠️ 限制</button>
      <button class="subbtn" data-s="diff">🔍 和原版差在哪</button>
    </div>
    <div class="sub on" id="s-fwd"><div id="fwdBox"></div></div>
    <div class="sub" id="s-ev"><div id="evBox"></div></div>
    <div class="sub" id="s-news"><div id="newsBox"></div></div>
    <div class="sub" id="s-limit"><div id="limitBox"></div></div>
    <div class="sub" id="s-diff"><div id="diffBox"></div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const j=async p=>{const r=await fetch(p+'?t='+Date.now());if(!r.ok)throw new Error(p+' '+r.status);return r.json();};
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
          set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
          del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let V=null, EV=null, FW=null, FW_ERR='';
function goTab(t){
  document.querySelectorAll('.tabbtn').forEach(x=>{const on=x.dataset.t===t;x.classList.toggle('on',on);
    if(on) x.scrollIntoView({inline:'center',block:'nearest'});});
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
}
function goSub(s){
  goTab('res');
  document.querySelectorAll('.subbtn').forEach(x=>{const on=x.dataset.s===s;x.classList.toggle('on',on);
    if(on) x.scrollIntoView({inline:'center',block:'nearest'});});
  document.querySelectorAll('.sub').forEach(p=>p.classList.toggle('on',p.id==='s-'+s));
}
window.goTab=goTab; window.goSub=goSub;
document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>goTab(b.dataset.t));
document.querySelectorAll('.subbtn').forEach(b=>b.onclick=()=>goSub(b.dataset.s));
function setCap(m,v){ v?ls.set('v2cap_'+m,v):ls.del('v2cap_'+m); render(); }
const cap=m=>parseFloat(ls.get('v2cap_'+m))||null;
const DEC_DEF={method_us:null,method_tw:null,lev_us:'1',lev_tw:'1',sat_tw:'0',conflict:'hold',credit_us:'smooth'};
function dec(k){ const v=ls.get('v2d_'+k); return v!==null?v:DEC_DEF[k]; }
function setDec(k,v){ ls.set('v2d_'+k,v); render(); renderDecisions(); }
window.setDec=setDec;
const fmt=n=>n==null?'—':n.toLocaleString(undefined,{maximumFractionDigits:2});
// 前台(今天怎麼做/我的設定)不顯示研究腳本檔名;完整出處留在「研究細節」
const clean=s=>String(s||'').replace(/[((]\s*research_[\w.\/ ]+?[))]/g,'').replace(/research_[\w]+\.py\s*[,、/]?\s*/g,'');
const ageH=t=>t?(Date.now()-new Date(String(t).replace(' ','T')+'+08:00').getTime())/3.6e6:Infinity;
const STALE_H=36;

// 空手的人 / 已持有的人 各自的燈號
const ENTRY={buy:['🟢 可買','buy'],wait:['🟡 先別買','wait'],cash:['⚪ 不進場','cash'],missing:['❓ 資料缺失','sell']};
const HOLD={hold:['🟢 續抱','buy'],reduce:['🟠 減碼','reduce'],sell:['🔴 賣出','sell'],missing:['❓ 資料缺失','sell']};
const METH_NAME={ew:'等權',ew3:'3檔等權',single:'只持有一檔',rotation:'單押最強',topn:'前N名'};

function methOf(mk,m){ return dec('method_'+mk) || m.default_method; }

function summaryLine(hs){
  const live=hs.filter(p=>p.weight>0);
  const cnt=(arr,k)=>arr.filter(p=>p[k.split(':')[0]]===k.split(':')[1]).length;
  const h=[], e=[];
  const hs_=cnt(live,'hold_action:sell'), hr=cnt(live,'hold_action:reduce'), hh=cnt(live,'hold_action:hold');
  if(hs_) h.push(`<b class="sell">賣出 ${hs_} 份</b>`);
  if(hr)  h.push(`<b class="reduce">減碼 ${hr} 份</b>`);
  if(hh)  h.push(`<b class="buy">續抱 ${hh} 份</b>`);
  const hm=cnt(live,'hold_action:missing');
  if(hm) h.push(`<b class="sell">資料缺失 ${hm} 份(先別動)</b>`);
  const eb=cnt(live,'action:buy'), ew=cnt(live,'action:wait'), ec=cnt(live,'action:cash');
  if(eb) e.push(`<b class="buy">可買 ${eb} 份</b>`);
  if(ew) e.push(`<b class="wait">先別買 ${ew} 份</b>`);
  if(ec) e.push(`<b class="cash">不進場 ${ec} 份</b>`);
  return `<div class="sum">📌 <b>今天:</b>已持有 → ${h.join('、')||'—'};空手 → ${e.join('、')||'—'}</div>`;
}

function mktCard(mk, m, title, cur){
  const age=ageH(m.source_time);
  if(age>STALE_H){
    return `<div class="card"><h2>${title}</h2><div class="warnbox red">🔴 <b>這個市場的資料已經 ${Math.round(age)} 小時沒更新</b>
      (最後一次:${m.source_time||'不明'})。自動更新可能失敗了,<b>先別依這一塊下單</b>。</div></div>`;
  }
  const K=cap(mk);
  const meth = methOf(mk,m);
  const lev = parseFloat(dec('lev_'+mk))||1;
  const sat = (mk==='tw') ? (parseFloat(dec('sat_tw'))||0) : 0;
  const satAll = sat>=1;
  const coreShare = satAll ? 0 : (1-sat);
  const hs = m.methods[meth] || m.positions;
  const ev = (V.method_evidence||{})[mk] || {};
  const RE = V.rule_evidence||{};
  const OF = m.official||{};
  const h = m.credit_health;
  const credit = h>=1 ? `<span class="badge" style="color:#9fe7bd">信用🟢 全額</span>`
    : h>0 ? `<span class="badge" style="color:#ffd9b0">信用🟠 ×${Math.round(h*100)}%</span>`
    : `<span class="badge" style="color:#ffb4b4">信用🔴 全部跌破</span>`;
  const tile=(lab,val,col)=>`<div style="flex:1;min-width:76px;background:var(--panel2);border-radius:7px;padding:5px 7px;text-align:center">
      <div class="tlab">${lab}</div>
      <div style="font-size:13px;font-weight:800;color:${col||'var(--txt)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${val}</div></div>`;
  const held = hs.filter(p=>p.weight>0 && coreShare>0);
  const other = hs.filter(p=>!(p.weight>0 && coreShare>0));
  const rows = held.map(p=>{
    const [el,ec]=ENTRY[p.action]||['—','grey'];
    const [hl,hc]=HOLD[p.hold_action]||['—','grey'];
    const slot = K!=null ? K*p.weight*coreShare : null;
    const cadj = (mk==='us' && dec('credit_us')==='wealth' && h>0 && h<1) ? 1/h : 1;  // 美股信用哨「皆壞才清倉」版:部分示警不打折
    const tgt  = (slot!=null && p.expo!=null) ? slot*p.expo*cadj*lev : null;
    const sh   = (tgt!=null && p.close) ? Math.floor(tgt/p.close) : null;
    const tgtv = p.expo==null ? '維持現倉'
      : tgt!=null ? `${cur}${fmt(Math.round(tgt))}` : `${Math.round(p.expo*cadj*lev*100)}%`;
    const stopRed = p.hold_action==='sell' && p.state==='risk_off';
    const rescue = p.vbottom_active ? `<div class="warnbox orange" style="margin-top:6px">🚑 V底救援觸發:半倉進場,停損 −7%(見下方說明)</div>`:'';
    return `<div style="background:#0b1727;border:1px solid #16233a;border-radius:9px;padding:9px 11px;margin-top:8px">
      <div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap">
        <b style="font-size:15px">${p.ticker.replace('.TW','')}</b>
        <span class="why">${p.name||''}</span>
        <span class="why" style="margin-left:auto">這份 ${Math.round(p.weight*coreShare*100)}%${slot!=null?` = ${cur}${fmt(Math.round(slot))}`:''}</span>
      </div>
      <div class="rowline"><span class="who">持有中</span><span class="act ${hc}">${hl}</span><span class="why">${p.hold_reason||''}</span></div>
      <div class="rowline"><span class="who">空手</span><span class="act ${ec}">${el}</span><span class="why">${p.reason||''}</span></div>
      ${rescue}
      <div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap">
        ${tile('現價', cur+fmt(p.close))}
        ${tile('追高上限(超過先別買)', p.limit!=null?cur+fmt(p.limit):'—', '#4da3ff')}
        ${tile('停損線(看收盤)', p.stop!=null?cur+fmt(p.stop):'—', stopRed?'#ff5a5a':null)}
        ${tile(`目標部位 ×${lev}`, tgtv, p.expo===0?'var(--grey)':'var(--txt)')}
      </div>
      ${(sh!=null&&p.expo>0)?`<div class="why" style="margin-top:4px">目標約 ${fmt(sh)} 股${mk==='tw'?'(以零股計;1 張 = 1000 股)':''}。
        持有中:調到這個部位;空手:亮 🟢 時買到這個部位。</div>`:''}
      ${traceBlock(p)}
      ${(p.conflict && meth==='rotation')?`<div class="warnbox orange" style="margin-top:6px;font-size:11.5px">
        ${p.conflict_note} <b>你目前選的:${dec('conflict')==='hold'?'續抱到跌破停損線':'不在200MA之上就換掉'}</b>
        <a href="#" onclick="goTab('dec');return false;">(改)</a></div>`:''}
    </div>`;
  }).join('');
  const otherBox = other.length ? `<details style="margin-top:8px"><summary class="why">其他 ${other.length} 檔不在「${METH_NAME[meth]||meth}」裡(展開看)</summary>
    <div class="why" style="padding:4px 0 0 14px">${other.map(p=>`${p.ticker.replace('.TW','')} 現價 ${cur}${fmt(p.close)} · 持有中 ${(HOLD[p.hold_action]||['—'])[0]} · 空手 ${(ENTRY[p.action]||['—'])[0]}`).join('<br>')}</div></details>` : '';
  const mbtn=(v,txt)=>`<button class="mbtn ${meth===v?'on':''}" onclick="setMethod('${mk}','${v}')">${txt}${m.default_method===v?' ·預設':''}</button>`;
  const rh = m.rotation_hold||{};
  const picked = (held[0]||{}).ticker;
  const pick = meth==='rotation' ? `<div class="note" style="margin:0 0 6px">${rh.ticker
      ? `目前選中:<b>${rh.ticker.replace('.TW','')}</b>(RS 最強)· 已持有 ${rh.days_held} 天${rh.locked?`,還要鎖 ${rh.lock_days_left} 天才准換`:''}`
      : `目前沒有合格的持有標的;今天 RS 最強 = <b>${(picked||rh.today_strongest||'—').replace('.TW','')}</b>,下面列的是它`}</div>`
    : meth==='single' ? `<div class="note" style="margin:0 0 6px">固定持有 <b>${mk==='us'?'QQQ':'0050'}</b>,不換。</div>` : '';
  const miss = ((m.missing_cores||[]).length || (m.missing_canary||[]).length)
    ? `<div class="warnbox red">❓ <b>今天有資料沒抓到</b>:${[...(m.missing_cores||[]),...(m.missing_canary||[]).map(t=>t+'(信用哨)')].join('、')}。
      ${(m.missing_canary||[]).length?'信用哨不完整,<b>今天的乘數不可靠,整個市場先別動</b>。':'缺的那一份先別動,其他份照常(份數仍以應有的檔數計)。'}等下一班更新。</div>` : '';
  const intraday = (mk==='us' && m.intraday_tentative) ? `<div class="warnbox blue">⏳ <b>美股盤中暫定數字</b>:${m.intraday_note||''} 決策看隔天 09:00 那班(收盤價)。</div>`:'';
  const cbox = (h!=null && h<=0) ? `<div class="warnbox red">🔴 <b>信用哨全部跌破</b>:已持有 → 下一個交易日全部賣出;空手 → 不買。等哨兵站回 200MA 再進。
      ${mk==='us'?`<br><span style="font-size:11.5px"><b>建議照做(證據等級:中)</b>。美股這條統計上不顯著(ΔSharpe +0.08、p=0.17,24 年只有 3~4 次危機),但 2022 年升息空頭少跌 21 個百分點;
      官方績效(${OF.x1?OF.x1.cagr+'% / '+OF.x1.mdd+'%':''})含這條規則,不照做就和官方數字對不上。</span>`:''}</div>`

function satCard(mk,m,K,sat,lev,cur,tile){
  if(!(mk==='tw'&&sat>0&&m.satellite)) return '';
  const t=m.satellite; const sl=K!=null?K*sat:null;
  const ps=(sl!=null&&t.expo!=null)?sl*t.expo*lev:null; const shs=(ps!=null&&t.close)?Math.floor(ps/t.close):null;
  const [l2,c2]=ENTRY[t.action]||['—','grey'];
  return `<div style="background:#160f1f;border:1px solid #3a2a50;border-radius:9px;padding:9px 11px;margin-top:10px">
    <div style="display:flex;align-items:baseline;gap:7px;flex-wrap:wrap"><b style="font-size:15px">00631L</b>
      <span class="why">${t.name||'正2'} · 衛星 ${Math.round(sat*100)}%</span>
      <span class="act ${c2}" style="margin-left:auto">${l2}</span></div>
    <div class="why" style="margin-top:2px">這份資金 ${Math.round(sat*100)}%${sl!=null?` = ${cur}${fmt(Math.round(sl))}`:''}</div>
    <div style="display:flex;gap:5px;margin-top:7px;flex-wrap:wrap">
      ${tile('現價', cur+fmt(t.close))}${tile('追高上限', t.limit!=null?cur+fmt(t.limit):'—','#4da3ff')}
      ${tile('停損線(看收盤)', t.stop!=null?cur+fmt(t.stop):'—')}
      ${tile(`目標部位 ×${lev}`, ps!=null?cur+fmt(Math.round(ps)):(t.action==='cash'?'現金':'—'))}</div>
    ${(t.action==='buy'&&shs!=null)?`<div class="why" style="margin-top:4px">約 ${fmt(shs)} 股(零股)</div>`:''}
    <div class="why" style="margin-top:6px">${t.gate_0050_ok?'✅ 母股 0050 在 200MA 之上(閘門開)':'🔴 母股 0050 跌破 200MA → 正2 一律空手'} · ${clean(t.reason)}</div>

}

function renderForward(){
  const box=$('#fwdBox'); if(!box) return;
  if(!FW){ box.innerHTML=`<div class="card">前瞻追蹤資料載入失敗${FW_ERR?`(${FW_ERR})`:''}</div>`; return; }
  const W=360,H=170,L=40,col=['#ff9d5a','#4da3ff','#8a96ad'];
  const card=(mk,title)=>{
    const raw=FW.markets[mk]||[]; if(!raw.length) return '';
    // 曲線完全相同的版本合併成一條(否則後畫的會把前面的蓋掉)
    const groups=[]; raw.forEach(r=>{const key=JSON.stringify(r.curve.map(c=>c[1]));
      const g=groups.find(x=>x.key===key); g?g.rows.push(r):groups.push({key,rows:[r]});});
    const all=raw.flatMap(r=>r.curve.map(c=>c[1])); const lo=Math.min(0,...all), hi=Math.max(0,...all);
    const n=Math.max(...raw.map(r=>r.curve.length));
    const y=v=>H-18-(v-lo)/((hi-lo)||1)*(H-30), x=i=>L+i/Math.max(n-1,1)*(W-L-8);
    const lines=groups.map((g,k)=>`<polyline fill="none" stroke="${col[k]}" stroke-width="2" points="${g.rows[0].curve.map((c,i)=>x(i)+','+y(c[1])).join(' ')}"/>`).join('');
    const ax=[hi,0,lo].filter((v,i,a)=>a.indexOf(v)===i).map(v=>`<text x="${L-4}" y="${y(v)+4}" fill="#8a96ad" font-size="10" text-anchor="end">${v>0?'+':''}${(+v).toFixed(2)}%</text>
      <line x1="${L}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#26304a" ${v===0?'stroke-dasharray="3 3"':''}/>`).join('');
    const c0=raw[0].curve; const dates=c0.length?`<text x="${L}" y="${H-3}" fill="#8a96ad" font-size="10">${c0[0][0]}</text>
      <text x="${W-8}" y="${H-3}" fill="#8a96ad" font-size="10" text-anchor="end">${c0[c0.length-1][0]}</text>`:'';
    const legend=groups.map((g,k)=>`<span style="color:${col[k]}">●</span> ${g.rows.map(r=>r.name).join(' = ')}${g.rows.length>1?'(今天持倉相同,線重疊)':''}`).join('<br>');
    const tbl=raw.map(r=>{const k=groups.findIndex(g=>g.rows.includes(r));return `<tr><td style="padding:5px"><span style="color:${col[k]}">●</span> ${r.name}</td>
      <td class="num" style="padding:5px;color:${r.ret_pct>=0?'#7ee0a0':'#ff8f8f'}">${r.ret_pct>0?'+':''}${r.ret_pct}%</td>
      <td class="num" style="padding:5px">${r.mdd_pct}%</td><td class="num" style="padding:5px">${Math.round(r.expo_now*100)}%</td></tr>`;}).join('');
    return `<div class="card"><h2>${title}</h2>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--panel2);border-radius:8px">${ax}${lines}${dates}</svg>
      <div class="why" style="margin-top:4px">${legend}<br>縱軸 = 規則定案後的累積報酬;虛線 = 0%。</div>
      <div style="overflow-x:auto"><table style="margin-top:6px"><tr><th>版本</th><th>定案後報酬</th><th>最大回撤</th><th>模擬持有者曝險</th></tr>${tbl}</table></div>
      <div class="why">已經過 ${raw[0].days} 個交易日。${mk==='us'?'全現金時的報酬 = 美國國庫券利息。':''}
      「模擬持有者曝險」是已持有者的部位;新進資金依黃燈規則可能是 0%。</div></div>`;
  };
  box.innerHTML=`<div class="card"><h2>📈 前瞻追蹤</h2>
    <div class="why" style="font-size:12.5px">這是規則定案(<b>${FW.freeze}</b>)之後的<b>真實表現</b>,不是事後回測。天數少時差距多半是雜訊,至少看滿 12 個月再下結論。
    (模擬持有層;黃燈進場時機、V底救援、R3 未模擬。)</div>
    <div class="why" style="margin-top:4px">更新:${FW.generated}</div></div>`+card('us','🇺🇸 美股')+card('tw','🇹🇼 台股');
}

(async ()=>{
  try{
    [V, EV] = await Promise.all([j('v2_status.json'), j('v2_evidence.json')]);
    try{ FW = await j('paper_forward.json'); }catch(e){ FW=null; FW_ERR=e.message; }
    // ★新舊逐來源檢查:頁首取「最舊」的那個(之前只看 v2_status 產生時間,台股來源舊了一個月也亮綠燈)
    const srcs=[['頁面資料',V.generated],['美股',V.markets.us.source_time],['台股',V.markets.tw.source_time]];
    const oldest=srcs.reduce((a,b)=>ageH(b[1])>ageH(a[1])?b:a);
    const stale=ageH(oldest[1])>STALE_H;
    $('#updated').innerHTML = `${stale?'🔴':'🟢'} 資料時間(台北):美股 <b>${String(V.markets.us.source_time||'—').slice(5,16)}</b> · 台股 <b>${String(V.markets.tw.source_time||'—').slice(5,16)}</b>`
      + `(每天 09:00 / 21:00 / 22:30 自動更新,排程偶爾延遲,以這裡的時間為準)`
      + (stale?` — <b style="color:var(--red)">${oldest[0]}已經 ${Math.round(ageH(oldest[1]))} 小時沒更新,先別依那一塊下單</b>`:'');
    render(); renderDecisions(); renderForward(); renderNews(); renderEvidence(); renderDiff(); renderLimit();
    $('#foot').textContent = `v2 · 規則版本 ${V.rules_version||EV.version} · 訊號用收盤價計算,下一個交易日執行(回測假設收盤成交,這一天的落差未量化)`;
  }catch(e){
    $('#updated').innerHTML = '<span style="color:var(--red)">⚠️ 資料載入失敗:'+e.message+'</span>';
  }
})();
</script>
</body>
</html>
